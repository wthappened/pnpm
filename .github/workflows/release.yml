name: Build pnpm win32-x64

on:
  workflow_dispatch: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.decide.outputs.rust_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: decide
        run: |
          RUST_VERSION=$(jq -r .version pnpm/npm/pnpm/package.json)
          echo "rust_version=$RUST_VERSION" >> "$GITHUB_OUTPUT"

  build-node-gyp-payload:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
      - run: pnpm --filter=pacquet run bundle-node-gyp
      - run: tar czf node-gyp-payload.tar.gz -C pnpm/npm/pnpm dist
      - uses: actions/upload-artifact@v4
        with:
          name: node-gyp-payload
          path: node-gyp-payload.tar.gz

  build:
    needs: [plan, build-node-gyp-payload]
    name: Build pnpm win32-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        shell: bash
        run: cargo build --locked -p pnpm-cli --bin pnpm --release --target x86_64-pc-windows-msvc

      - uses: actions/download-artifact@v4
        with:
          name: node-gyp-payload
          path: node-gyp-payload

      - name: Archive
        shell: bash
        run: |
          mv target/x86_64-pc-windows-msvc/release/pnpm.exe pnpm.exe
          tar xzf node-gyp-payload/node-gyp-payload.tar.gz
          7z a pnpm-win32-x64.zip pnpm.exe dist

      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-win32-x64
          path: "*.zip"
